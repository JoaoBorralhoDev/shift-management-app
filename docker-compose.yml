services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports: ["15672:15672"]
  auth-service:
    build: ./services/api
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/shiftflow}
      JWT_SECRET: ${JWT_SECRET:-alterar-por-um-segredo-longo}
      RABBITMQ_URL: amqp://rabbitmq:5672
      SERVICE_SCOPE: auth
      PORT: 3000
    depends_on: [mongo, rabbitmq]
  workers-service:
    build: ./services/api
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/shiftflow}
      JWT_SECRET: ${JWT_SECRET:-alterar-por-um-segredo-longo}
      RABBITMQ_URL: amqp://rabbitmq:5672
      SERVICE_SCOPE: workers
      PORT: 3000
    depends_on: [mongo, rabbitmq]
  shifts-service:
    build: ./services/api
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/shiftflow}
      JWT_SECRET: ${JWT_SECRET:-alterar-por-um-segredo-longo}
      RABBITMQ_URL: amqp://rabbitmq:5672
      SERVICE_SCOPE: shifts
      PORT: 3000
    depends_on: [mongo, rabbitmq]
  reports-service:
    build: ./services/api
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/shiftflow}
      JWT_SECRET: ${JWT_SECRET:-alterar-por-um-segredo-longo}
      RABBITMQ_URL: amqp://rabbitmq:5672
      SERVICE_SCOPE: reports
      PORT: 3000
    depends_on: [mongo, rabbitmq]
  notifications:
    build: ./services/notifications
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/shiftflow}
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on: [mongo, rabbitmq]
  frontend:
    build: ./frontend
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [auth-service, workers-service, shifts-service, reports-service, frontend]
volumes:
  mongo_data:
