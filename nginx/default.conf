server {
  listen 80;
  location /api/auth/ { proxy_pass http://auth-service:3000/auth/; proxy_set_header Host $host; }
  location /api/users { proxy_pass http://auth-service:3000/users; proxy_set_header Host $host; }
  location /api/notifications { proxy_pass http://auth-service:3000/notifications; proxy_set_header Host $host; }
  location /api/announcements { proxy_pass http://auth-service:3000/announcements; proxy_set_header Host $host; }
  location /api/health { proxy_pass http://auth-service:3000/health; proxy_set_header Host $host; }
  location /api/workers { proxy_pass http://workers-service:3000/workers; proxy_set_header Host $host; }
  location /api/tasks { proxy_pass http://workers-service:3000/tasks; proxy_set_header Host $host; }
  location /api/availability { proxy_pass http://workers-service:3000/availability; proxy_set_header Host $host; }
  location /api/cargos { proxy_pass http://workers-service:3000/cargos; proxy_set_header Host $host; }
  location /api/shifts { proxy_pass http://shifts-service:3000/shifts; proxy_set_header Host $host; }
  location /api/schedules { proxy_pass http://shifts-service:3000/schedules; proxy_set_header Host $host; }
  location /api/dashboard { proxy_pass http://shifts-service:3000/dashboard; proxy_set_header Host $host; }
  location /api/demo { proxy_pass http://shifts-service:3000/demo; proxy_set_header Host $host; }
  location /api/restrictions { proxy_pass http://shifts-service:3000/restrictions; proxy_set_header Host $host; }
  location /api/reports { proxy_pass http://reports-service:3000/reports; proxy_set_header Host $host; }
  location / { proxy_pass http://frontend:80/; proxy_set_header Host $host; }
}
